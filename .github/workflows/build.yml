name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      # JDK 21 is the toolchain of the plugin modules; JDK 25 runs Gradle (last entry becomes the default).
      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: |
            21
            25
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew --stacktrace build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds each consumer migrated to these conventions against this change, before it is released: the conventions
  # are published to Maven Local and the consumer's pin is pointed at them (.github/actions/canary and
  # .github/scripts/canary.sh). gradle-tools is built by the sharded job below.
  canary:
    name: canary (${{ matrix.consumer.repository }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - repository: kelvSYC/kotlin-tools
            tasks: ":check"
          # consumerCompatibilityTest builds rifflet's fixture on the supported Kotlin/Java floors (JDK 17), so a change
          # to the shared floors that breaks old consumers fails here.
          - repository: kelvSYC/rifflet
            tasks: ":check consumerCompatibilityTest"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Canary
        uses: ./.github/actions/canary
        with:
          repository: ${{ matrix.consumer.repository }}
          tasks: ${{ matrix.consumer.tasks }}

  # gradle-tools' root :check honours -Pcheck.shard=<index>/<count> (a deterministic split of its cores), so it runs as
  # parallel shards. Its Gradle daemon must run on JDK 21 (gradle/gradle-daemon-jvm.properties; its detekt needs it),
  # and those criteria name no download URL, so its build is started from the JDK 21 installed by the action. To change
  # the shard count, change every `shard` entry and the count in `tasks` together.
  canary-gradle-tools-shard:
    name: canary (kelvSYC/gradle-tools ${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Canary
        uses: ./.github/actions/canary
        with:
          repository: kelvSYC/gradle-tools
          tasks: ":check -Pcheck.shard=${{ matrix.shard }}"
          jdk: "21"

  # The required check `canary (kelvSYC/gradle-tools)`: passes only when every shard job succeeded. It runs even
  # when a shard failed, and a cancelled or skipped shard job fails it. It depends on the shards alone, so the other
  # consumers' results do not affect it.
  canary-gradle-tools:
    name: canary (kelvSYC/gradle-tools)
    runs-on: ubuntu-latest
    needs: canary-gradle-tools-shard
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Require every gradle-tools shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.canary-gradle-tools-shard.result }}
        run: |
          echo "gradle-tools shards: ${SHARDS_RESULT}"
          [ "${SHARDS_RESULT}" = "success" ]
