name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      # JDK 21 is the toolchain of the plugin modules; JDK 25 runs Gradle (last entry becomes the default).
      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@v6
        with:
          java-version: |
            21
            25
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: ./gradlew --stacktrace build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds each consumer migrated to these conventions against this change, before it is released: the conventions
  # are published to Maven Local and the consumer's pin is pointed at them (.github/scripts/canary.sh).
  canary:
    name: canary (${{ matrix.consumer.repository }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - repository: kelvSYC/kotlin-tools
            tasks: ":check"
          # consumerCompatibilityTest builds rifflet's fixture on the supported Kotlin/Java floors (JDK 17), so a change
          # to the shared floors that breaks old consumers fails here.
          - repository: kelvSYC/rifflet
            tasks: ":check consumerCompatibilityTest"
          # gradle-tools' Gradle daemon must run on JDK 21 (gradle/gradle-daemon-jvm.properties; its detekt needs it),
          # and those criteria name no download URL, so its build is started from the JDK 21 installed below.
          - repository: kelvSYC/gradle-tools
            tasks: ":check"
            jdk: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      # JDK 25 runs Gradle (last entry becomes the default); 21 builds the plugin modules here; 17 runs consumers'
      # floor checks (rifflet's consumer compatibility fixture).
      - name: Set up JDKs 17, 21 and 25
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
            25
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Before the consumer is checked out: an untracked consumer/ directory would make this version `+dirty`.
      - name: Publish the conventions to Maven Local
        id: conventions
        run: |
          ./gradlew --stacktrace publishToMavenLocal
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          echo "Published ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Full history: the consumer's version comes from its tags.
      - name: Checkout the consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.consumer.repository }}
          path: consumer
          fetch-depth: 0
          filter: tree:0
      # A consumer that needs another JDK for its Gradle daemon names it as `jdk`; setup-java exports each installed
      # JDK as JAVA_HOME_<version>_X64.
      - name: Build the consumer
        env:
          CONSUMER_JDK: ${{ matrix.consumer.jdk }}
        run: |
          if [ -n "$CONSUMER_JDK" ]; then
            jdk_home_var="JAVA_HOME_${CONSUMER_JDK}_X64"
            export JAVA_HOME="${!jdk_home_var:?JDK ${CONSUMER_JDK} is not installed in this job}"
            echo "Building the consumer with JAVA_HOME=${JAVA_HOME}"
          fi
          .github/scripts/canary.sh consumer "${{ steps.conventions.outputs.version }}" ${{ matrix.consumer.tasks }} --stacktrace
