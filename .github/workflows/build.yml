name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      # JDK 21 is the toolchain of the plugin modules; JDK 25 runs Gradle (last entry becomes the default).
      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@v6
        with:
          java-version: |
            21
            25
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build
        run: ./gradlew --stacktrace build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
