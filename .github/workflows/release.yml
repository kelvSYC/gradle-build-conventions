name: Release
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '**/*.md'
      - 'docs/**'

# Two merges must not race on the same tag.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Labels of the merged pull request (gh api .../commits/{sha}/pulls).
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Set up JDKs 21 and 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: |
            21
            25
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Tag the release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A release tag already on this commit (e.g. pushed by hand) is reused, never bumped past.
          existing=$(git tag --points-at "${{ github.sha }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$existing" ]; then
            echo "Reusing ${existing}"
            echo "tag=${existing}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Latest release tag, by version order. Only vMAJOR.MINOR.PATCH counts.
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          # Labels of the PR that produced this commit (the API returns [] for direct pushes).
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[].labels[].name')

          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            if grep -qx 'release:major' <<< "$labels"; then
              next="v$((major + 1)).0.0"
            elif grep -qx 'release:minor' <<< "$labels"; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          echo "Releasing ${next} (previous: ${latest:-none})"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Local only for now: semver reads local tags, and pushing before a successful publish
          # would leave a remote tag without artifacts.
          git tag -a "$next" -m "Release $next" "${{ github.sha }}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "push=true" >> "$GITHUB_OUTPUT"
      # A failing check stops the release before anything is published or the tag is pushed. A
      # separate invocation: with the configuration cache, tasks of one invocation run in parallel,
      # so `check publish` could start publishing before every check had passed.
      - name: Check
        run: ./gradlew --stacktrace check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # HEAD is the tagged commit, so semver resolves the bare release version.
      - name: Publish
        run: ./gradlew --stacktrace publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tag
        if: steps.tag.outputs.push == 'true'
        run: git push origin "${{ steps.tag.outputs.tag }}"
