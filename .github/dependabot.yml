version: 2
# Dependabot takes this build's repositories from settings.gradle.kts (dependencyResolutionManagement); see AGENTS.md.
# It also reads the publishing repository in the root build's `subprojects {}` block as a dependency repository, so its
# logs show harmless 404s for libraries looked up there.
updates:
  - package-ecosystem: gradle
    directory: /
    # Weekly: each merge releases and becomes a bump in every consumer, so updates arrive as a weekly digest.
    schedule:
      interval: weekly
    # The compiler Kotlin version follows Gradle's embedded Kotlin, so Dependabot must not bump it.
    ignore:
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugins-bom"
      - dependency-name: "org.jetbrains.kotlin.multiplatform"
      # The AWS SDKs publish patch releases almost daily (mostly new service APIs); take their minor updates only.
      # A consumer that needs a newer patch can override the version locally.
      - dependency-name: "software.amazon.awssdk:bom"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "aws.sdk.kotlin:bom"
        update-types: ["version-update:semver-patch"]
    # Every merge to main is a release that consumers then pick up, so routine updates arrive as one grouped PR
    # (one release). Majors, pre-1.0 libraries (where a "minor" can break) and the Gradle wrapper (which must
    # change together with the catalog's `gradle` version) get their own PRs. To split a surprise out of the
    # group, comment `@dependabot ignore <dependency> minor version` on the grouped PR.
    groups:
      catalog-minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "gradle-wrapper"
          - "org.jetbrains.kotlinx:kotlinx-datetime"
          - "org.pkl-lang:*"
          - "org.msgpack:*"
  - package-ecosystem: github-actions
    directory: /
    # Dependabot holds back releases younger than a few days by default, and drops versions with no release date.
    cooldown:
      default-days: 3
    schedule:
      interval: daily
